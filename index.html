    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <script>
      // اللغة والاتجاه قبل أول رسم (نفس منطق detectLang في src/i18n)
      try {
        var l = localStorage.getItem("almo_lang");
        if (l !== "ar" && l !== "en") {
          l = ((navigator.languages && navigator.languages[0]) || navigator.language || "en").toLowerCase().indexOf("ar") === 0 ? "ar" : "en";
        }
        document.documentElement.lang = l;
        document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
      } catch (e) {}
    </script>
    <title>AL MO Digital Solutions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
